name: Basic CI

on:
  push:
    branches: [ main ] # CI запускается при push в ветку main
  workflow_dispatch: # и по кнопке Run workflow во вкладке Actions

permissions:
  contents: read # права доступа только на чтение

jobs:
  check:
    runs-on: ubuntu-latest # запускается на виртуальной машине с самой свежей версией Ubuntu

    steps: # шаги
      - name: Checkout code # проверка кода
        uses: actions/checkout@v5

      - name: Set up Python # установка Python
        uses: actions/setup-python@v6 # установщик
        with:
          python-version: '3.12' # версия Python

      - name: Install dependencies # установка зависимостей, сначала идет проверка не устарели ли версии, затем установка всех зависимостей, затем установка библиотек pytest, httpx
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt
          pip install pytest 'httpx<0.28' flake8

      - name: Run linter (critical errors only) # Проверка критических ошибок по указанным кодам, а именно: синтаксические, логические операторы, синтаксические внутри функции и циклов, обращение к неопределенным именам. Флаги кода показывают конкретную строку кода, где произошла ошибка, а флаг статистики выводит итоговый отчёт со счетчиком по каждому типу найденных ошибок
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests # Запуск тестов из /tests (проверка жизнеспособности, удаление несуществующей задачи, удаление успешной существующей задачи)
        run: pytest -q
